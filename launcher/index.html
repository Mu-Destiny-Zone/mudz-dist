<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mu Destiny Zone – Launcher</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Segoe UI,Tahoma,sans-serif;
}

/* ===== SCALE WRAPPER ===== */
.viewport{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ===== LAUNCHER ===== */
.launcher{
    width:797px;
    height:388px;
    position:relative;
    overflow:hidden;

    display:grid;
    grid-template-columns:64% 36%;
    padding:22px;
    gap:22px;

    transform:scale(
        min(calc(100vw / 797), calc(100vh / 388))
    );
    transform-origin:center;
}

/* ================= BACKGROUND CAROUSEL ================= */
.bg-carousel{
    position:absolute;
    inset:0;
    z-index:0;
}

.bg-slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation:bgFade 24s infinite;
}

/* FILE NAMES MATCH YOUR PNGs */
.bg1{ background-image:url('bg-1.png'); animation-delay:0s; }
.bg2{ background-image:url('bg-2.png'); animation-delay:6s; }
.bg3{ background-image:url('bg-3.png'); animation-delay:12s; }
.bg4{ background-image:url('bg-4.png'); animation-delay:18s; }

@keyframes bgFade{
    0%   {opacity:0}
    8%   {opacity:1}
    25%  {opacity:1}
    33%  {opacity:0}
    100% {opacity:0}
}

/* Readability overlay */
.bg-carousel::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        rgba(0,0,0,.85)
    );
    pointer-events:none;
}

/* ================= CONTENT ================= */
.content{
    position:relative;
    z-index:10;
    display:contents;
}

/* ================= NEWS ================= */
.news-panel{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.panel-title{
    font-size:20px;
    color:#d4af37;
    letter-spacing:2px;
    margin-bottom:10px;
}

.server-block{margin-bottom:8px}

.server-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:4px;
}

.server-title.easy{color:#7fe3a8}
.server-title.normal{color:#8fc3ff}
.server-title.hard{color:#ffb26b}

.news-row{
    display:flex;
    gap:12px;
    padding:5px 0;
    color:#eee;
    border-bottom:1px solid rgba(255,255,255,.22);
}
.news-row:last-child{border-bottom:none}

.date{
    color:#d4af37;
    font-weight:600;
    font-size:12px;
    min-width:50px;
}
.title{font-size:13px}

/* ================= STATUS ================= */
.status-panel{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
}

.status-row{
    width:250px;
    height:32px;
    padding:0 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(0,0,0,.55);
    border:1px solid rgba(212,175,55,.45);
    border-radius:2px;

    font-size:13px;
    font-weight:600;
    letter-spacing:.6px;
    color:#e6e1d0;
}

.status-left{
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
}

.online .status-dot{background:#3fa96b}
.maintenance .status-dot{background:#d9822b}

.status-text{
    font-size:12px;
    font-weight:700;
}
.online .status-text{color:#3fa96b}
.maintenance .status-text{color:#d9822b}

.website-btn{
    margin-top:8px;
    width:250px;
    height:32px;
    line-height:32px;
    text-align:center;
    text-decoration:none;

    font-size:13px;
    font-weight:700;
    letter-spacing:1px;

    background:#1b1b1b;
    border:1px solid #b8963a;
    border-radius:2px;
    color:#e6e1d0;
}
</style>
</head>

<body>
<div class="viewport">

<div class="launcher">

    <!-- BACKGROUND -->
    <div class="bg-carousel">
        <div class="bg-slide bg1"></div>
        <div class="bg-slide bg2"></div>
        <div class="bg-slide bg3"></div>
        <div class="bg-slide bg4"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="news-panel">
            <div class="panel-title">NEWS</div>

            <div class="server-block">
                <div class="server-title easy">EASY SERVER</div>
                <div class="news-row"><span class="date">DEC 20</span><span class="title">Easy Server Launch Event</span></div>
                <div class="news-row"><span class="date">DEC 18</span><span class="title">Beginner EXP Boost</span></div>
            </div>

            <div class="server-block">
                <div class="server-title normal">NORMAL SERVER</div>
                <div class="news-row"><span class="date">DEC 20</span><span class="title">Illusion Knight Rises</span></div>
                <div class="news-row"><span class="date">DEC 18</span><span class="title">Optimization Patch Live</span></div>
            </div>

            <div class="server-block">
                <div class="server-title hard">HARD SERVER</div>
                <div class="news-row"><span class="date">DEC 21</span><span class="title">Hardcore PvP Season</span></div>
                <div class="news-row"><span class="date">DEC 17</span><span class="title">Boss Drop Nerfs</span></div>
            </div>
        </div>

        <div class="status-panel">
            <div class="status-row online">
                <div class="status-left"><span class="status-dot"></span>EASY SERVER</div>
                <div class="status-text">ONLINE</div>
            </div>

            <div class="status-row online">
                <div class="status-left"><span class="status-dot"></span>NORMAL SERVER</div>
                <div class="status-text">ONLINE</div>
            </div>

            <div class="status-row maintenance">
                <div class="status-left"><span class="status-dot"></span>HARD SERVER</div>
                <div class="status-text">MAINTENANCE</div>
            </div>

            <a class="website-btn" href="https://mudestinyzone.com" target="_blank">
                <i class="fa-solid fa-globe"></i> OFFICIAL WEBSITE
            </a>
        </div>

    </div>
</div>

</div>
</body>
</html>
